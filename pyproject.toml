[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "members-only"
version = "0.1.0"
description = "Human-gated security controls for individual AI agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
members-only = "members_only.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
testpaths = ["tests"]
